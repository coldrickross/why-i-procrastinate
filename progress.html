<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alex's 4 weeks — Why I Procrastinate</title>
<meta name="description" content="A live, public look at one person's 4-week commitment to showing up. Watch their progress, their why, and what's on the line." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <nav class="nav" aria-label="Primary">
    <a class="brand" href="index.html">Why I Procrastinate<span class="dot">.</span></a>
    <div class="links">
      <a href="index.html">Feelings</a>
      <a href="scale.html">The Scale</a>
      <a href="worksheet.html">Worksheet</a>
      <a href="progress.html" class="active">Journey</a>
    </div>
  </nav>

  <main class="wrap prog-wrap">
    <header id="progHero" class="prog-hero" aria-label="Hero"></header>

    <nav class="prog-view-switch" role="tablist" aria-label="Journey view">
      <button type="button" class="pill-btn prog-view-btn is-selected" role="tab" aria-selected="true" data-view="today">Today</button>
      <button type="button" class="pill-btn prog-view-btn" role="tab" aria-selected="false" data-view="plan">My plan</button>
    </nav>

    <div class="prog-today-view is-active" role="tabpanel" aria-label="Today">
      <section id="progStrip" class="prog-strip" aria-label="Progress at a glance"></section>
      <section id="progCommitment" class="prog-panel" aria-label="The commitment"></section>
      <section id="progTracker" class="prog-panel" aria-label="4-week tracker"></section>
      <section id="progLatest" class="prog-panel" aria-label="Latest reflection"></section>
    </div>

    <div class="prog-plan-view" role="tabpanel" aria-label="My plan" hidden>
      <section id="progStart" class="prog-panel" aria-label="Where you started"></section>
      <section id="progWhy" class="prog-panel" aria-label="Why this matters"></section>
      <section id="progCurrent" class="prog-panel" aria-label="The cost of now"></section>
      <section id="progStakes" class="prog-panel" aria-label="What's on the line"></section>
      <section id="progDistractions" class="prog-panel" aria-label="Distractions removed"></section>
      <section id="progResistance" class="prog-panel" aria-label="Friction reducers"></section>
      <section id="progAccountability" class="prog-panel" aria-label="Accountability"></section>
      <section id="progFallbacks" class="prog-panel" aria-label="Fallback plans"></section>
      <section id="progMissedDay" class="prog-panel" aria-label="If you miss a day"></section>
    </div>

    <aside class="cta-bar prog-cta">
      <div>
        <h3>Start your own 4 weeks.</h3>
        <p>Turn your answers into a printable plan with a live tracker.</p>
      </div>
      <a class="btn" href="worksheet.html">Open the worksheet &rarr;</a>
    </aside>
  </main>

  <footer class="page-foot">
    <p>This is an example journey. <a href="worksheet.html">Build your own</a>.</p>
  </footer>

  <script src="assets/nav-lock.js"></script>
  <script src="assets/progress-data.js"></script>
  <script src="assets/progress.js"></script>
</body>
</html>
